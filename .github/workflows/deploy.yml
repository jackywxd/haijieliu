name: Deploy

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit,
  # for example after rotating the Cloudflare token.
  workflow_dispatch:

# Deploys are not cancelled mid-flight: a half-uploaded asset set is worse
# than a superseded one, and the next run overwrites it anyway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build

      # The build already ran above, so this is `npm run deploy` without the
      # second build it would otherwise trigger.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
