name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build

      - name: Unit tests
        run: npm run test:unit

      # Installed before anything is served, so a browser download failure
      # surfaces on its own rather than looking like a test failure.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium

      # `wrangler dev` serves out/ through the same Workers Assets routing as
      # production — clean URLs and the 404 page — which `next dev` does not.
      # It keeps running for the steps below.
      - name: Serve the build
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8788 > wrangler-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8788/ && exit 0
            sleep 1
          done
          echo "wrangler dev did not come up within 60s:"; cat wrangler-dev.log
          exit 1

      # The same checks the deploy runs against production, here against this
      # pull request's build. Media is fetched from the production CDN, so a
      # new year added to videos.json without its MP4 uploaded fails here,
      # before merge, rather than after deploy.
      - name: Smoke test the build
        env:
          SITE: http://127.0.0.1:8788
        run: EXPECT_BUILD_ID="$(cat .next/BUILD_ID)" npm run test:smoke

      - name: End-to-end tests
        env:
          BASE_URL: http://127.0.0.1:8788
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            wrangler-dev.log
          retention-days: 14
